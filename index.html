<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proxy Browser Portal</title>
    <style>
      :root {
        --bg-1: #0b1020;
        --bg-2: #121a2d;
        --panel: rgba(255,255,255,0.06);
        --panel-border: rgba(255,255,255,0.12);
        --text: #f4f4f4;
        --muted: #dfe7ff;
        --primary-1: #7c5cff;
        --primary-2: #3f80ff;
        --shadow: rgba(0,0,0,0.25);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--text);
        font-family: Arial, sans-serif;
      }

      .browser {
        width: min(1200px, 96vw);
        height: min(92vh, 920px);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        box-shadow: 0 25px 60px var(--shadow);
        overflow: hidden;
      }

      .browser-topbar {
        height: 72px;
        background: rgba(255,255,255,0.04);
        border-bottom: 1px solid var(--panel-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        gap: 16px;
      }

      .nav-dots {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .red { background: #ff5f57; }
      .yellow { background: #ffbd2f; }
      .green { background: #28c840; }

      .browser-title {
        flex: 1;
        text-align: center;
        font-weight: bold;
        color: var(--muted);
        letter-spacing: 0.04em;
      }

      .content {
        display: grid;
        grid-template-columns: 420px 1fr;
        height: calc(100% - 72px);
      }

      .sidebar {
        border-right: 1px solid var(--panel-border);
        background: rgba(255,255,255,0.02);
        padding: 16px;
        overflow-y: auto;
      }

      .proxy-card {
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        padding: 14px;
        margin-bottom: 18px;
      }

      .proxy-label {
        display: block;
        font-weight: 700;
        margin-bottom: 12px;
        color: var(--muted);
      }

      .proxy-base {
        margin-bottom: 10px;
      }

      .proxy-base input {
        width: 100%;
        margin-top: 6px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--panel-border);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        outline: none;
      }

      .search-row {
        display: flex;
        gap: 10px;
      }

      input[type="text"] {
        flex: 1;
        padding: 11px 12px;
        border-radius: 10px;
        border: 1px solid var(--panel-border);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        outline: none;
      }

      button {
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--primary-1), var(--primary-2));
        color: white;
        font-weight: bold;
        padding: 11px 14px;
        cursor: pointer;
      }

      .result {
        position: relative;
        background: rgba(0,0,0,0.18);
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
        background: white;
      }

      @media (max-width: 900px) {
        .content {
          grid-template-columns: 1fr;
        }

        .sidebar {
          max-height: 44vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="browser">
      <div class="browser-topbar">
        <div class="nav-dots">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>

        <div class="browser-title">Proxy Browser</div>

        <div style="width: 120px;"></div>
      </div>

      <div class="content">
        <aside class="sidebar">
          <div class="proxy-card">
            <label class="proxy-label">Proxy 1 = Google</label>

            <div class="proxy-base">
              <small>Custom proxy base</small>
              <input id="proxy1base" type="text" value="https://r.jina.ai/http://" />
            </div>

            <div class="search-row">
              <input id="proxy1input" type="text" placeholder="Type a website or search term" />
              <button onclick="runSearch('proxy1')">Go</button>
            </div>
          </div>

          <div class="proxy-card">
            <label class="proxy-label">Proxy 2 = Bing</label>

            <div class="proxy-base">
              <small>Custom proxy base</small>
              <input id="proxy2base" type="text" value="https://r.jina.ai/http://" />
            </div>

            <div class="search-row">
              <input id="proxy2input" type="text" placeholder="Type a website or search term" />
              <button onclick="runSearch('proxy2')">Go</button>
            </div>
          </div>

          <div class="proxy-card">
            <label class="proxy-label">Proxy 3 = DuckDuckGo</label>

            <div class="proxy-base">
              <small>Custom proxy base</small>
              <input id="proxy3base" type="text" value="https://r.jina.ai/http://" />
            </div>

            <div class="search-row">
              <input id="proxy3input" type="text" placeholder="Type a website or search term" />
              <button onclick="runSearch('proxy3')">Go</button>
            </div>
          </div>
        </aside>

        <div class="result">
          <iframe id="resultFrame" title="Proxy result" src="https://www.google.com/"></iframe>
        </div>
      </div>
    </div>

    <script>
      const searchEngines = {
        proxy1: "https://www.google.com/search?q=",
        proxy2: "https://www.bing.com/search?q=",
        proxy3: "https://duckduckgo.com/?q="
      };

      function looksLikeWebsite(value) {
        return /(?:[a-z0-9-]+\.)+[a-z]{2,}/i.test(value) || /^https?:\/\//i.test(value);
      }

      function buildProxyUrl(base, site) {
        let proxyBase = (base || "").trim() || "https://r.jina.ai/http://";
        let cleanSite = site.replace(/^https?:\/\//i, "");

        if (proxyBase.includes("{{url}}")) {
          return proxyBase.replace("{{url}}", encodeURIComponent(site));
        }

        if (proxyBase.includes("?") || proxyBase.includes("=") || proxyBase.includes("&")) {
          return proxyBase + encodeURIComponent(site);
        }

        return proxyBase + cleanSite;
      }

      function runSearch(proxyName) {
        const inputId = proxyName + "input";
        const baseId = proxyName + "base";
        const value = document.getElementById(inputId).value.trim();
        const proxyBase = document.getElementById(baseId).value.trim();

        if (!value) {
          alert("Please type a website or a search term.");
          return;
        }

        const frame = document.getElementById("resultFrame");

        if (looksLikeWebsite(value)) {
          let site = value;
          if (!/^https?:\/\//i.test(site)) site = "https://" + site;
          frame.src = buildProxyUrl(proxyBase, site);
          return;
        }

        const searchUrl = searchEngines[proxyName] + encodeURIComponent(value);
        frame.src = searchUrl;
      }

      // Enter key support
      document.addEventListener("keydown", function (event) {
        const active = document.activeElement;

        if (event.key === "Enter" && active && active.tagName === "INPUT") {
          const id = active.id;

          if (id === "proxy1input") runSearch("proxy1");
          if (id === "proxy2input") runSearch("proxy2");
          if (id === "proxy3input") runSearch("proxy3");
        }
      });
    </script>
  </body>
</html>
