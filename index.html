<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Dashboard</title>
    <style>
      :root {
        --bg-1: #0b1020;
        --bg-2: #121a2d;
        --bg-3: #1a2240;
        --panel: rgba(255, 255, 255, 0.06);
        --panel-strong: rgba(255, 255, 255, 0.1);
        --panel-border: rgba(255, 255, 255, 0.12);
        --text: #f4f4f4;
        --muted: #dfe7ff;
        --primary-1: #7c5cff;
        --primary-2: #3f80ff;
        --success: #4ade80;
        --warning: #fbbf24;
        --shadow: rgba(0, 0, 0, 0.25);
      }

      body.light {
        --bg-1: #edf4ff;
        --bg-2: #dfeaff;
        --bg-3: #edf1ff;
        --panel: rgba(255, 255, 255, 0.72);
        --panel-strong: rgba(255, 255, 255, 0.9);
        --panel-border: rgba(20, 30, 60, 0.08);
        --text: #111827;
        --muted: #4b5563;
        --primary-1: #6d5ef8;
        --primary-2: #2c7df7;
        --success: #16a34a;
        --warning: #d97706;
        --shadow: rgba(98, 120, 190, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(124, 92, 255, 0.28), transparent 25%),
          radial-gradient(circle at bottom right, rgba(63, 128, 255, 0.22), transparent 30%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--text);
        transition: background 0.3s ease, color 0.3s ease;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 32px 16px;
      }

      .portal {
        width: min(1100px, 100%);
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 22px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        box-shadow: 0 18px 40px var(--shadow);
        backdrop-filter: blur(14px);
        margin-bottom: 24px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .logo {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--primary-1), var(--primary-2));
        color: white;
        font-size: 1.2rem;
        font-weight: 700;
        box-shadow: 0 14px 25px rgba(124, 92, 255, 0.35);
      }

      .brand-text {
        font-size: 1.05rem;
      }

      .theme-toggle {
        border: 1px solid var(--panel-border);
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        border-radius: 999px;
        padding: 10px 16px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s ease;
      }

      .theme-toggle:hover {
        transform: translateY(-1px);
      }

      .hero {
        display: grid;
        grid-template-columns: 1.6fr 1fr;
        gap: 20px;
        margin-bottom: 24px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        box-shadow: 0 20px 45px var(--shadow);
        backdrop-filter: blur(12px);
      }

      .welcome {
        padding: 32px;
      }

      .welcome h1 {
        margin: 0 0 18px;
        font-size: clamp(2.1rem, 4vw, 3.5rem);
        line-height: 1.1;
      }

      .welcome p {
        margin: 0 0 26px;
        font-size: 1.05rem;
        color: var(--muted);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px;
        border-radius: 999px;
        background: rgba(74, 222, 128, 0.12);
        border: 1px solid rgba(74, 222, 128, 0.28);
        color: var(--success);
        font-weight: bold;
        margin-bottom: 18px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 18px rgba(74, 222, 128, 0.9);
      }

      .quick-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(220px, 1fr));
        gap: 18px;
      }

      .link-card {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 180px;
        padding: 20px;
        background: linear-gradient(180deg, var(--panel-strong), rgba(255,255,255,0.02));
        border: 1px solid var(--panel-border);
        border-radius: 20px;
        text-decoration: none;
        color: var(--text);
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }
